<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <button type="button" id="new-tab">New</button>
        <label class="path-field">
          <span>Path</span>
          <input id="path-input" type="text" placeholder="C:\notes\demo.txt" spellcheck="false" />
        </label>
        <button type="button" id="open-path">Open</button>
        <button type="button" id="save">Save</button>
        <button type="button" id="close-tab">Close</button>
      </header>

      <nav id="tab-bar" class="tab-bar" aria-label="Buffers"></nav>

      <textarea
        id="editor"
        class="editor"
        spellcheck="false"
        placeholder="Untitled Buffer — start typing"
        disabled
      ></textarea>

      <p id="status" class="status" aria-live="polite"></p>
    </div>
  </body>
</html>
