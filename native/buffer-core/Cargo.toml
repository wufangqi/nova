[package]
name = "nova-buffer-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.11"
ropey = "1.6"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"
